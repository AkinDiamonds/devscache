# docker-compose.yml
version: '3.9'
services:
  db:
    image: postgres:16-alpine
    container_name: devscache_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - devscache_pgdata:/var/lib/postgresql/data
volumes:
  devscache_pgdata: